[package]
name = "persistence_library"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
platevault_model = { path = "../../platevault-model" }
fs_pathsafe = { path = "../../fs/pathsafe" }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
uuid = { workspace = true, features = ["v5"] }
time.workspace = true
sha2.workspace = true
hex.workspace = true
skymath = "0.7.2"
tempfile.workspace = true
specta = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[features]
# IPC type derives on the types that cross the library-shell boundary. Off by
# default; only contracts_core and desktop_shell enable it.
wire = ["dep:specta", "dep:schemars", "platevault_model/wire"]

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[dev-dependencies]
parking_lot = "0.12"

[lints]
workspace = true
