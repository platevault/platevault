[package]
name = "contracts_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "generate-contracts"
path = "src/bin/generate-contracts.rs"

[[bin]]
name = "schema-agreement-test"
path = "src/bin/schema-agreement-test.rs"

[dependencies]
calibration_core = { path = "../../calibration/core" }
domain_core = { path = "../../domain/core" }
# Library-shell wire types (F4 WIRE bindings deviation): the derives behind
# their `wire` feature feed the library schema generator.
platevault_model = { path = "../../platevault-model", features = ["wire"] }
persistence_library = { path = "../../persistence/library", features = ["wire"] }
platevault_core = { path = "../../platevault-core", features = ["wire"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
strum.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

[lints]
workspace = true
