[package]
name = "platevault_notify_macos"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Spec 072 R13: the macOS UNUserNotificationCenter FFI behind a safe API. The
# notification plugin's desktop permission API always reports Granted and
# discards delivery errors, so reminders read the framework directly. This is
# the one crate whose lint table allows `unsafe`, and only at the FFI call
# sites; the application crates keep the workspace `forbid`.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSBundle",
    "NSError",
    "NSString",
] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
    "std",
    "bitflags",
    "block2",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSettings",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

# The workspace table with `unsafe_code` at `deny` instead of `forbid`, so the
# FFI call sites can allow it one at a time. Keep the rest in step with the
# workspace `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
disallowed_methods = "allow"
use_self = "warn"
redundant_pub_crate = "warn"
derive_partial_eq_without_eq = "warn"
redundant_clone = "warn"
needless_collect = "warn"
significant_drop_tightening = "warn"
or_fun_call = "warn"
cognitive_complexity = "warn"
