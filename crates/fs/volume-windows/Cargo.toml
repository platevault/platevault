[package]
name = "fs_volume_windows"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# astro-plan-f2di3: the file system, serial and drive type of the volume
# holding a path, read through Win32 calls instead of a PowerShell CIM query
# per probe, behind a safe API. Those are three FFI calls, so this crate alone
# allows `unsafe` at their call sites and `platevault_core` keeps the
# workspace `forbid`. Empty on every other target.
[target.'cfg(windows)'.dependencies]
# `GetVolumePathNameW`, `GetVolumeInformationW` and `GetDriveTypeW`
# (`Win32_Storage_FileSystem`); the version `platevault_eject_windows` and
# `fs_noreplace_windows` already lock.
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
# The `\\?\` form a path reaches `GetVolumePathNameW` in (`long_path`).
fs_pathsafe = { path = "../pathsafe" }

[target.'cfg(windows)'.dev-dependencies]
tempfile = { workspace = true }

# The workspace table with `unsafe_code` at `deny` instead of `forbid`, so the
# FFI call sites can allow it. Keep the rest in step with the workspace
# `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
disallowed_methods = "allow"
use_self = "warn"
redundant_pub_crate = "warn"
derive_partial_eq_without_eq = "warn"
redundant_clone = "warn"
needless_collect = "warn"
significant_drop_tightening = "warn"
or_fun_call = "warn"
cognitive_complexity = "warn"
