[package]
name = "fs_pathsafe"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
camino = { workspace = true }
path-clean = { workspace = true }
safe-filename = { path = "../../safe-filename" }
# The export's no-replace final step (`persist_noclobber`).
tempfile.workspace = true

# Classifies the errno of a volume without no-replace rename or hard links.
[target.'cfg(unix)'.dependencies]
rustix = "1.1"

[features]
# Enables `test_support` for crates that build containment fixtures in their own
# tests. Off by default, so the helpers stay out of release builds.
test-fixture = []

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
