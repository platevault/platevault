[package]
name = "platevault_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
platevault_model = { path = "../platevault-model" }
persistence_library = { path = "../persistence/library" }
metadata_core = { path = "../metadata/core" }
metadata_fits = { path = "../metadata/fits" }
metadata_xisf = { path = "../metadata/xisf" }
fs_pathsafe = { path = "../fs/pathsafe" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sqlx.workspace = true
tokio.workspace = true
uuid = { workspace = true, features = ["v5"] }
time.workspace = true
sha2.workspace = true
hex.workspace = true
unicode-normalization.workspace = true
simbad-resolver = "0.5.0"
skymath = "0.7.2"
target-match = "0.5.1"
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
trash.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
