[package]
name = "platevault_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
platevault_model = { path = "../platevault-model" }
platevault_pixels = { path = "../platevault-pixels" }
persistence_library = { path = "../persistence/library" }
calibration_master_detect = { path = "../calibration/master-detect" }
metadata_core = { path = "../metadata/core" }
metadata_fits = { path = "../metadata/fits" }
metadata_xisf = { path = "../metadata/xisf" }
fs_pathsafe = { path = "../fs/pathsafe" }
# The Output watcher and the new-captures watcher (bead astro-plan-ef440)
# reuse the folder watcher (RAII guard, overflow flag, rescan signal); the
# Output watcher also reuses the stable-size rule (spec 070 RES-FR-01, F4 OUTPUT).
fs_inventory = { path = "../fs/inventory" }
workflow_artifacts = { path = "../workflow/artifacts" }
# Shared PRJ-FR-29 panel overlap band tolerance.
targeting = { version = "0.1.0", path = "../targeting" }
camino.workspace = true
tracing.workspace = true
patterns = { path = "../patterns" }
safe-filename = { path = "../safe-filename" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["time"] }
uuid = { workspace = true, features = ["v5"] }
time.workspace = true
sha2.workspace = true
hex.workspace = true
unicode-normalization.workspace = true
csv.workspace = true
base64 = "0.22.1"
# Import previews each destination volume's free space (STO-IMP-FR-03).
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
simbad-resolver = "0.5.0"
skymath = "0.7.2"
target-match = "0.5.1"
# Spec 072 R3: the bundled IANA database only, so every platform and test
# resolves the same zone rules for nights, local times and calendar text.
jiff = { version = "0.2.37", default-features = false, features = [
  "std",
  "tzdb-bundle-always",
] }
tempfile.workspace = true
specta = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[features]
# IPC type derives on the types that cross the library-shell boundary. Off by
# default; only contracts_core and desktop_shell enable it.
wire = [
  "dep:specta",
  "dep:schemars",
  "platevault_model/wire",
  "persistence_library/wire",
]
# Lets a test hold a real Apply where a tool holding a file in View would
# (`apply::pacing`, the shell's IPC tests). Off by default and enabled only on
# `[dev-dependencies]` edges, so no release binary can stall a real Apply.
test-pacing = []

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"
# The folder and file rename that never replaces (`custody::transfer`).
fs_noreplace_windows = { path = "../fs/noreplace-windows" }
# The Windows volume of a path is read by Win32 calls, not PowerShell.
fs_volume_windows = { path = "../fs/volume-windows" }
winreg = "0.56.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }
# The kernel file handle in a Linux file ID (astro-plan-yju9s).
fs_file_handle_linux = { path = "../fs/file-handle-linux" }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
trash.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
persistence_library = { path = "../persistence/library", features = ["test-counters"] }
platevault_pixels = { path = "../platevault-pixels", features = ["fixtures"] }
parking_lot = "0.12.5"

[lints]
workspace = true
