[package]
name = "desktop_services"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Framework-agnostic desktop backend services: notifications, logging, the log
# viewer stream, job-progress feeds and the signed updater. A UI host (the
# Tauri shell today) adapts them to its own event mechanism. No Tauri framework
# crate (`tauri*`), `flutter_rust_bridge` or `raw-window-handle` may enter this
# dependency graph; `tests/dependency_boundary.rs` enforces that and documents
# its one exemption.

[dependencies]
app_core = { path = "../../app/core" }
audit = { path = "../../audit" }
contracts_core = { path = "../../contracts/core" }
persistence_lifecycle = { path = "../../persistence/lifecycle" }
platevault_core = { path = "../../platevault-core" }
# The updater (`src/update`): base64 unwraps the minisign key and signature
# boxes as tauri.conf.json and latest.json store them; minisign-verify is the
# verifier tauri-plugin-updater 2.13 used, here in its streaming form;
# reqwest fetches the manifest and payload; semver compares versions;
# tempfile holds the staged payload.
base64 = "0.22.1"
minisign-verify = "0.3.0"
notify-rust = { workspace = true }
reqwest = { workspace = true, features = ["system-proxy"] }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# The privileged deb, rpm and macOS installs check root's own copy of the
# payload against the SHA-256 of the bytes `Staged::reverify` verified
# (astro-plan-ryj83). sha2 is the workspace's digest crate; Windows locks the
# payload instead and needs none.
[target.'cfg(unix)'.dependencies]
sha2 = { workspace = true }

# The macOS update unpacks the `.app.tar.gz` and exchanges the bundles with
# rustix's `renameat_with(EXCHANGE)`, as platevault_core does for its links.
# The swap's tests run on every Unix, so other Unix targets get the three
# crates for tests only. The update offer's notification buttons
# (`src/update/offer`) go through platevault_notify_macos, the workspace's
# UNUserNotificationCenter bindings.
[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "1.1.9"
platevault_notify_macos = { path = "../../platevault-notify-macos" }
rustix = { version = "1.1", features = ["fs"] }
tar = "0.4.46"

[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
flate2 = "1.1.9"
rustix = { version = "1.1", features = ["fs"] }
tar = "0.4.46"

[dev-dependencies]
# Signs test payloads with throwaway keys for the updater's signature tests.
minisign = { workspace = true }
persistence_core = { path = "../../persistence/core" }
# Real FITS frames for the measurement feed tests.
platevault_pixels = { path = "../../platevault-pixels", features = ["fixtures"] }
tokio = { workspace = true, features = ["time", "net", "io-util", "test-util"] }

[lints]
workspace = true
