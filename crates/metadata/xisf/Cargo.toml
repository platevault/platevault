[package]
name = "metadata_xisf"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
metadata_core = { path = "../core" }
# nightwatch-astro/xisf-header#33 (approved): `update_file` edits files with
# several attachments, such as an Image with a Thumbnail. Pinned to the
# reviewed rev until it is released; replace with the released version.
xisf-header = { git = "https://github.com/nightwatch-astro/xisf-header", rev = "76b86dd7668dfc11012d47003418b0b1280ba665" }
# The SHA-256 of a patched copy once it is proven against its original.
sha2.workspace = true

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
