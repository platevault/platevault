[package]
name = "metadata_fits"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
metadata_core = { path = "../core" }
# nightwatch-astro/fits-header#31 (reviewed, CI green): HIERARCH value cards
# are addressable through `Key::hierarch`, a breaking change (0.5.0). Pinned
# to the reviewed rev until it is released; replace with the released version.
fits-header = { git = "https://github.com/nightwatch-astro/fits-header", rev = "eb05656768b314d070f6879ad3ced70d7900818d" }
# The SHA-256 of a patched copy as it is written, and of its original.
sha2.workspace = true

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
