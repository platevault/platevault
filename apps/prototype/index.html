<!doctype html>
<html lang="en-GB" class="dark" data-theme="platevault-dark" data-density="comfortable">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>PlateVault prototype</title>
  <!-- No favicon asset in the prototype; an empty data icon keeps the browser from requesting /favicon.ico. -->
  <link rel="icon" href="data:," />
  <script>
    // Pre-paint theme, language and density so the first frame uses the saved choice.
    // PlateVault Dark is the default; "system" follows prefers-color-scheme between the
    // PlateVault themes. src/app/preferences.ts stores the resolved scheme for this script.
    {
      const root = document.documentElement
      let theme = "platevault-dark"
      let scheme = "dark"
      let density = "comfortable"
      let locale = "en-GB"
      try {
        theme = localStorage.getItem("platevault.theme") || theme
        scheme = localStorage.getItem("platevault.themeScheme") || scheme
        density = localStorage.getItem("platevault.density") || density
        locale = localStorage.getItem("platevault.locale") || locale
      } catch { }
      if (theme === "dark" || theme === "light") {
        scheme = theme
        theme = `platevault-${theme}`
      }
      if (theme === "system") {
        scheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        theme = `platevault-${scheme}`
      }
      root.dataset.theme = theme
      root.classList.toggle("dark", scheme === "dark")
      root.dataset.density = density
      root.lang = locale
      document.querySelector('meta[name="color-scheme"]').content = scheme
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
