<!doctype html>
<html lang="en-GB" data-density="comfortable">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>PlateVault prototype</title>
  <script>
    // Pre-paint theme and density so the first frame uses the saved choice.
    // The product follows the system appearance unless the user picks one.
    {
      const root = document.documentElement
      let theme = "system"
      let density = "comfortable"
      try {
        theme = localStorage.getItem("platevault.theme") || "system"
        density = localStorage.getItem("platevault.density") || "comfortable"
      } catch { }
      const dark =
        theme === "dark" ||
        (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
      root.classList.toggle("dark", dark)
      root.dataset.density = density
      document.querySelector('meta[name="color-scheme"]').content = dark ? "dark" : "light"
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
