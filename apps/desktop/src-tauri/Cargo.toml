[package]
name = "desktop_shell"
version = "0.6.0"
edition.workspace = true
license.workspace = true
default-run = "desktop_shell"

[lib]
path = "src/lib.rs"
# Cdylib makes `cargo tauri build` happy; rlib keeps the lib loadable from
# integration tests in this crate (e.g. the tauri-specta binding-export test).
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
app_core = { path = "../../../crates/app/core" }
# Framework-agnostic backend services: notifications, logging, the log viewer
# stream and job-progress feeds. This shell adapts them to Tauri events, and
# `wire` exports their event payloads to the library-shell bindings.
desktop_services = { path = "../../../crates/desktop/services", features = ["wire"] }
platevault_core = { path = "../../../crates/platevault-core", features = ["wire"] }
persistence_library = { path = "../../../crates/persistence/library", features = ["wire"] }
camino = { workspace = true }
workflow_profiles = { path = "../../../crates/workflow/profiles" }
audit = { path = "../../../crates/audit" }
# spec 042 (T250): the SIMBAD resolver/seed surface this shell consumes moved
# from `targeting` into the `targeting_resolver` crate.
targeting_resolver = { path = "../../../crates/targeting/resolver" }
# spec 052 P1: AppState owns the shared redb resolve-cache handle directly
# (Cache trait for .cache()/search, identity::namespace for warming).
simbad-resolver = "0.5.0"
# target.astro_format.batch: sexagesimal RA/Dec formatting (adopt target-match).
targeting = { path = "../../../crates/targeting" }
# target.moon_opposition.batch (#634): geocentric Sun/Moon position
# (sun_position/moon_position — not re-exported by `targeting`, which only
# re-exports the coordinate primitives).
skymath = "0.7.2"
contracts_core = { path = "../../../crates/contracts/core" }
domain_core = { path = "../../../crates/domain/core" }
fs_inventory = { path = "../../../crates/fs/inventory" }
fs_pathsafe = { path = "../../../crates/fs/pathsafe" }
persistence_core = { path = "../../../crates/persistence/core" }
persistence_inbox = { path = "../../../crates/persistence/inbox" }
persistence_lifecycle = { path = "../../../crates/persistence/lifecycle" }
persistence_plans = { path = "../../../crates/persistence/plans" }
persistence_targets = { path = "../../../crates/persistence/targets" }
workflow_artifacts = { path = "../../../crates/workflow/artifacts" }
serde = { workspace = true }
serde_json.workspace = true
# The running version the updater compares against, and the dev-tools-gated
# PV_E2E_VERSION_OVERRIDE that replaces it.
semver = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
sqlx = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
# Agent-driven UI automation surface — ONLY compiled when `dev-tools` is
# enabled. Release binaries MUST omit that feature so the WebSocket control
# server is absent from the binary rather than merely unstarted.
tauri-plugin-mcp-bridge = { workspace = true, optional = true }
# Spec 051 shell integration plugins.
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-specta = { workspace = true }
# E2E automation surface — ONLY compiled when the `e2e` feature is enabled.
# Release binaries MUST omit this feature so the embedded WebDriver server
# is never present at runtime (Constitution Principle V, mirrors `dev-tools`).
tauri-plugin-webdriver = { version = "0.2", optional = true }
time = { workspace = true }
tracing = { workspace = true }
# The library shell binary's stderr subscriber.
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
# `v5`: the e2e host names each run's macOS webview data store after its data
# directory (`library_shell::webview_store_id`).
uuid = { workspace = true, features = ["v5"] }
futures-util = { workspace = true }

# Spec 072 R13: the macOS reminder adapter reads UNUserNotificationCenter
# through the dedicated FFI crate, never the notification plugin.
[target.'cfg(target_os = "macos")'.dependencies]
platevault_notify_macos = { path = "../../../crates/platevault-notify-macos" }

# astro-plan-ef440: a removable Captures drive ejects while discovery watches
# it, through the Windows removal notices of the dedicated FFI crate.
[target.'cfg(windows)'.dependencies]
platevault_eject_windows = { path = "../../../crates/platevault-eject-windows" }

[dev-dependencies]
# The `test` feature gates the `tauri::test` module (mock runtime, IPC
# helpers). Only dev-dependencies pull it in so release builds stay clean.
tauri = { workspace = true, features = ["test"] }
tempfile = { workspace = true }
# `tests/backend_journeys.rs` diverts OS trash through the executor's
# headless double (`FakeTrashGuard`): the Shell trash blocks forever on a CI
# runner with no interactive desktop. Dev-only, so no shipping build can reach
# it.
fs_executor = { path = "../../../crates/fs/executor", features = ["e2e-trash-fake"] }
# `tests/library_controls.rs` holds a real Apply where a tool holding a file
# in View would (`platevault_core::apply::pacing`), and builds its world with
# the core's own test support, which hashes with sha2 and hex. Dev-only, so
# no shipping build can stall an Apply.
platevault_core = { path = "../../../crates/platevault-core", features = ["test-pacing"] }
sha2 = { workspace = true }
hex = { workspace = true }
# The workspace's FITS fixture builder: `tests/library_restart.rs` scans real
# FITS files through the library shell.
fits_fixtures = { path = "../../../crates/testing/fits-fixtures" }

[features]
# Developer-mode surface (spec 021). Release binaries MUST NOT enable this.
# Propagates to app_core so the dev_contracts use-case module is compiled in.
# Also embeds tauri-plugin-mcp-bridge and, via build.rs, widens the capability
# glob to `capabilities/dev/`, which is where the plugin's permission grant
# lives. With the feature off the plugin's ACL manifest does not exist, so an
# ungated grant would fail the build.
dev-tools = ["app_core/dev-tools", "dep:tauri-plugin-mcp-bridge"]
# E2E automation gate (spec 037). Embeds tauri-plugin-webdriver so the app
# binary accepts W3C WebDriver sessions from the tauri-webdriver CLI proxy.
# The embedded server listens on 127.0.0.1:4445; the tauri-webdriver CLI
# (cargo install tauri-webdriver --locked) proxies :4444 → :4445.
# Release binaries MUST NOT enable this feature (Constitution Principle V).
# Also compiles the headless OS-trash double the harness needs, since the Shell
# trash blocks forever without an interactive window-station.
e2e = ["dep:tauri-plugin-webdriver", "app_core/e2e-trash-fake"]

[lints]
workspace = true
