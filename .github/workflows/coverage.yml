name: Coverage

# Rust test coverage via cargo-llvm-cov.
#
# Runs for every release candidate (release-candidate.yml calls this workflow)
# and on manual dispatch, not on pull requests or pushes to main.
# Report-only: no threshold gate until a baseline is established. A failing
# test still fails the job, and with it the candidate.
#
# Linux-only: llvm-cov is OS-agnostic and the instrumented binaries are
# significantly larger; running on one platform avoids triple disk pressure.
# The job produces:
#   - an lcov report (uploaded as an artifact)
#   - a per-file summary in the job log
#
# cargo-llvm-cov wraps `cargo test`, so it covers unit tests and the
# real-SQLite Layer-1 integration tests in a single instrumented pass.
#
# Doctests are excluded on purpose. Instrumenting them makes rustdoc take
# `-Z persist-doctests`, which only nightly accepts, so passing `--doctests`
# here hard-fails the job. The workspace has no executable doctests to
# measure either. Re-add it behind `cargo +nightly llvm-cov` if that changes.

# Least-privilege GITHUB_TOKEN. Without this block the token inherits the
# repository or organisation default, which may grant write scopes these jobs
# never use. Every job here only reads the repo and uploads artifacts, and
# `actions/upload-artifact` needs no `contents: write` -- it writes to the
# Actions artifact store, not to git. Mirrors release-gate.yml, which already
# declares `contents: read` (astro-plan-j14r).
permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: 0
  # Same debug-level policy as ci.yml: keep line tables for backtrace
  # readability, drop type/variable info to keep artifact size bounded.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  coverage:
    name: Rust coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri's desktop_shell crate needs system webview libs on Linux.
      - name: Install Tauri Linux system deps
        timeout-minutes: 11
        run: bash scripts/install-tauri-linux-deps.sh libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          # llvm-tools-preview provides the LLVM coverage instrumentation
          # backend that cargo-llvm-cov links against at test time.
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          # Separate cache key: llvm-cov instrumented artifacts must not mix
          # with the non-instrumented objects the ci.yml integration job uses.
          # Sharing them produces miscounted or zeroed-out coverage data.
          shared-key: "rust-coverage-ubuntu-v1"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # The workspace test run includes Rust tests that shell out to `node` for
      # cross-language contract parity — `spec062_portable_contracts` spawns
      # `packages/contracts/tests/utf8-byte-keywords.test.mjs`, which imports
      # `ajv/dist/2020`. Without the JS deps installed those tests fail with
      # MODULE_NOT_FOUND, so this job needs the same Node setup as ci.yml's
      # integration job even though it is nominally Rust-only.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Collect coverage (workspace, unit + integration tests)
        run: |
          cargo llvm-cov \
            --workspace \
            --lcov \
            --output-path lcov.info

      - name: Print coverage summary
        run: cargo llvm-cov report --summary-only

      - name: Upload lcov report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ github.sha }}
          path: lcov.info
          retention-days: 30
