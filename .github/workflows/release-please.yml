name: Release Please

# Maintains a release PR from Conventional Commits (feat/fix/...), updates
# CHANGELOG.md, bumps the desktop app version in three synced files
# (apps/desktop/src-tauri/tauri.conf.json, apps/desktop/package.json,
# apps/desktop/src-tauri/Cargo.toml), and tags a plain `v{version}` release on
# merge. Runs ONLY on main: releases are cut from main, never from the
# redesign integration branch. The first release PR appears once this config
# lands on main (via #349) and a subsequent feat/fix is pushed.
#
# The release PR is verified by release-gate.yml, which posts the single
# "Release Gate / verdict" check the shepherd reads before merging.
#
# Once release-please tags+publishes a release (release_created == 'true'),
# the `build` job (spec 051 US10 / T060) builds the Tauri desktop app on the
# Windows/macOS/Linux matrix, signs the bundles + updater artifact with
# tauri-apps/tauri-action (minisign, via the TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]
# repo secrets), and uploads bundles and signatures to the release that
# release-please just created. With vars.ENABLE_WINDOWS_SIGNING on, the Windows
# leg instead builds its installers around executables SignPath has
# Authenticode-signed, and has SignPath sign the installers before it uploads
# them. Last, `updater-manifest` writes the `latest.json` updater manifest, but
# only once every leg has succeeded and every updater signature verifies
# against the bytes on the release. This is what makes
# https://github.com/platevault/platevault/releases/latest/download/latest.json
# resolve for the in-app updater: the services-crate client (0.7.0 on) and
# tauri-plugin-updater in 0.5.x/0.6.x installs read the same file, so every
# release keeps every platform key. The embedded public key that verifies
# these signatures lives in apps/desktop/src-tauri/tauri.conf.json and is
# owned by a separate US10 lane, not this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # The body with the code signing policy link (see the `notes` step),
      # or release-please's own body if that step wrote none.
      release_body: ${{ steps.notes.outputs.body || steps.release.outputs.body }}
    steps:
      # Mint a short-lived GitHub App installation token from the shared org
      # release app (contents:write + pull_requests:write). This is the
      # cross-org-correct identity: unlike a personal PAT it needs no org
      # approval and no lifetime management, and unlike the default GITHUB_TOKEN
      # its releases/tags DO trigger downstream workflows (release-gate on
      # `push: tags`) and its PR checks are not held as `action_required`.
      # Credentials are provisioned org-wide (visibility=all):
      #   RELEASE_APP_CLIENT_ID  — Actions variable
      #   RELEASE_APP_PRIVATE_KEY — Actions secret
      - name: Mint release-please app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # SignPath Foundation's conditions (https://signpath.org/terms.html) ask
      # for a "Code signing policy" link on every release page. release-please
      # has no release-notes footer option (its config schema offers only
      # pull-request-header and pull-request-footer), so this step appends the
      # link to the body release-please wrote and saves it to the release. The
      # build job passes the same body to tauri-action, so no leg drops it.
      # The output is written first and the edit is best-effort: if the edit
      # fails, tauri-action still saves the linked body when the first build
      # leg updates the release, and the release itself goes ahead.
      - name: Link the code signing policy from the release notes
        id: notes
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_PLEASE_BODY: ${{ steps.release.outputs.body }}
        run: |
          set -euo pipefail
          body="$(printf '%s\n\n%s' "${RELEASE_PLEASE_BODY}" \
            '[Code signing policy](https://github.com/platevault/platevault/blob/main/docs/release/code-signing-policy.md)')"
          delimiter="BODY_$(openssl rand -hex 16)"
          printf 'body<<%s\n%s\n%s\n' "${delimiter}" "${body}" "${delimiter}" >> "${GITHUB_OUTPUT}"
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes "${body}" \
            || echo "::warning::could not add the code signing policy link to ${TAG} now; the build legs save it through tauri-action"

  build:
    name: Build & sign (${{ matrix.os }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false # report each platform distinctly, same as CI's integration matrix
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # tauri-action publishes the release and uploads bundles
      id-token: write # OIDC identity that signs the attestation
      attestations: write # publish the attestation to this repo
      # The SignPath connector reads this job's details and downloads its
      # artifacts with the job token (the action's github-token input needs
      # actions: read and contents: read). Unused while Windows signing is off.
      actions: read
    steps:
      - uses: actions/checkout@v4

      # Tauri's desktop_shell crate needs system webview libs to build AND
      # bundle (deb/rpm/AppImage) on Linux. patchelf is additionally required
      # for AppImage bundling, which ci.yml's plain `cargo build` never
      # exercises.
      - name: Install Tauri Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - uses: dtolnay/rust-toolchain@1.99.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.os }}"

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # macOS Developer ID signing and notarization, off unless
      # vars.ENABLE_MACOS_SIGNING is 'true' (docs/development/code-signing.md).
      # The Tauri bundler treats an APPLE_* variable that is set as a request to
      # sign, even when its value is empty. It checks `var_os("APPLE_CERTIFICATE")`,
      # which is Some("") for an empty value. The v0.6.0 macOS leg passed
      # `APPLE_CERTIFICATE: ''` and failed with "failed to import keychain
      # certificate". A step-level `env:` cannot leave a variable unset, so the
      # build runs in one of two mutually exclusive tauri-action steps below:
      # with signing on, a step that carries the APPLE_* credentials in its own
      # `env:`, and otherwise a step that never sets them, where the bundler
      # ad-hoc signs as it did for v0.5.0. The credentials reach only that one
      # step, never later or post-job steps.
      #
      # With signing on, this check fails the leg before the build when any
      # credential is empty. It reads them and writes nothing.
      - name: Check macOS signing credentials
        if: runner.os == 'macOS' && vars.ENABLE_MACOS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=''
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then missing="${missing} ${name}"; fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::ENABLE_MACOS_SIGNING is 'true' but these are empty:${missing}. Set them, or unset ENABLE_MACOS_SIGNING to ship ad-hoc signed macOS builds."
            exit 1
          fi

      # Self-signed macOS signing (docs/release/macos-signing.md). With
      # Developer ID signing off and the MACOS_SELF_SIGNED_* secrets set, this
      # imports the stable identity named by vars.MACOS_SIGNING_IDENTITY into a
      # temporary keychain and exports APPLE_SIGNING_IDENTITY to the later
      # steps, so the bundler signs the .app with it instead of ad-hoc. It
      # passes no notarization credentials, so the bundler skips notarization.
      # The export goes through GITHUB_ENV, not a step-level `env:`, for the
      # reason given above: the bundler treats a set but empty APPLE_* variable
      # as a request to sign. With the secrets absent the script writes
      # nothing, and the build stays ad-hoc signed.
      - name: Import the self-signed macOS signing identity
        if: runner.os == 'macOS' && vars.ENABLE_MACOS_SIGNING != 'true'
        env:
          MACOS_SELF_SIGNED_P12: ${{ secrets.MACOS_SELF_SIGNED_P12 }}
          MACOS_SELF_SIGNED_P12_PASSWORD: ${{ secrets.MACOS_SELF_SIGNED_P12_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: bash scripts/macos-import-signing-identity.sh

      # tauri-action auto-detects the package manager by checking for a
      # lockfile inside `projectPath` — apps/desktop has no pnpm-lock.yaml of
      # its own (it lives at the workspace root), so auto-detection would fall
      # through to `npm run tauri`. `tauriScript: pnpm tauri` pins it to the
      # same invocation the justfile already uses for `tauri dev`.
      #
      # uploadUpdaterJson: false. Each leg used to merge its own platform into
      # the release's latest.json as it finished. A failed leg then left a
      # published manifest without that platform (v0.6.0 shipped with no
      # darwin-* key). The `updater-manifest` job writes latest.json once the
      # whole release is built, so updaterJsonPreferNsis, which only shapes
      # that file, is gone too. Its NSIS preference now lives in
      # scripts/assemble-updater-manifest.mjs. The .sig files are still uploaded
      # (uploadUpdaterSignatures defaults to true).
      #
      # releaseDraft: false — release-please (the `release-please` job above)
      # already published a real (non-draft) GitHub Release for this tag, so
      # this step finds that release by tag and uploads bundles/signatures to
      # it directly. In v1, tauri-action also updates the existing release name
      # and body from releaseName/releaseBody. We pass the name and body the
      # release-please job already saved, so the update is effectively a no-op.
      #
      # v1 breaking changes that do NOT bite us:
      #   - .app.tar.gz (macOS updater artifact) now embeds the app version in
      #     the filename. latest.json points at the asset names actually on the
      #     release, and both updater clients follow GitHub's redirects, so
      #     installed clients resolve the new names.
      #   - updaterJsonKeepUniversal removed (now always on): we never set it.
      #   - assetNamePattern renamed to artifactNamePattern: we don't use it.
      #   - Tauri v1/unstable support dropped: we are on Tauri 2 stable.
      #
      # The two steps differ only in `env:`. The second reuses the first's
      # inputs through the `tauri-action-inputs` anchor, and the
      # `artifactPaths` output is read from whichever ran. With
      # vars.ENABLE_WINDOWS_SIGNING on, the Windows leg runs neither: the
      # Windows signing steps at the end of this job build and upload its
      # bundles instead.
      - name: Build, sign, and upload Tauri bundles
        id: tauri
        if: >-
          (runner.os != 'macOS' || vars.ENABLE_MACOS_SIGNING != 'true')
          && (runner.os != 'Windows' || vars.ENABLE_WINDOWS_SIGNING != 'true')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with: &tauri-action-inputs
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseName: ${{ needs.release-please.outputs.tag_name }}
          releaseBody: ${{ needs.release-please.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false

      - name: Build, sign, and upload Tauri bundles (macOS code signing)
        id: tauri-macos-signed
        if: runner.os == 'macOS' && vars.ENABLE_MACOS_SIGNING == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        with: *tauri-action-inputs

      # Records how the shipped .app is signed. With the self-signed identity
      # imported, it fails the leg if the bundle is still ad-hoc signed,
      # carries another authority, or fails `codesign --verify --strict`.
      # Without it, an ad-hoc bundle is only reported, so a release without the
      # signing secrets still gets its latest.json.
      - name: Check the macOS app signature
        if: runner.os == 'macOS'
        run: bash scripts/macos-check-app-signature.sh

      # The import step's keychain holds the private key. Delete it as soon as
      # signing is over, even when an earlier step failed.
      - name: Delete the macOS signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "${RUNNER_TEMP}/platevault-signing.keychain-db" || true

      # Build provenance for the bundles this matrix leg produced: a signed statement of
      # which workflow run, at which commit, built these exact bytes. Complements the
      # minisign updater signatures rather than replacing them — those are what the
      # auto-updater checks against the app's embedded public key, offline and with no
      # GitHub dependency. Verified with `gh attestation verify`.
      #
      # With vars.ENABLE_WINDOWS_SIGNING on, the Windows leg skips this step and the
      # next: tauri-action did not run there, and the Windows signing steps below
      # attest the signed installers instead.
      #
      # tauri-action emits artifactPaths as a JSON array STRING (its src/index.ts does
      # JSON.stringify(artifacts.map(a => a.path))), which actions/attest cannot consume
      # directly — subject-path wants a newline-separated list. Converting here also
      # avoids hardcoding bundle paths: filenames carry the version, and the bundle
      # directory is the workspace's cargo target dir (target/release/bundle), not
      # apps/desktop/src-tauri/target.
      - name: Collect artifact paths
        id: subjects
        if: runner.os != 'Windows' || vars.ENABLE_WINDOWS_SIGNING != 'true'
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths || steps.tauri-macos-signed.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          # Drop .sig sidecars (signatures over the bundles, not artifacts in their own
          # right) and latest.json (a pointer regenerated on every release, so a
          # provenance claim over it ages out immediately).
          filter='.[] | select(endswith(".sig") or endswith("latest.json") | not)'
          subjects="$(printf '%s' "${ARTIFACT_PATHS:-[]}" | jq -r "${filter}")"

          # Fail loud rather than silently attesting nothing. If tauri-action changes its
          # output shape, an empty list would leave every bundle unattested while the job
          # still went green — the release would look provenance-covered when it was not.
          if [ -z "${subjects}" ]; then
            echo "::error::no bundles found in artifactPaths; refusing to attest an empty subject set"
            echo "artifactPaths was: ${ARTIFACT_PATHS:-<unset>}"
            exit 1
          fi

          {
            echo 'paths<<SUBJECTS_EOF'
            echo "${subjects}"
            echo 'SUBJECTS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: ${{ steps.subjects.outputs.paths != '' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}

      # Windows Authenticode signing through the SignPath Foundation free
      # open-source code-signing program. docs/development/code-signing.md has
      # the research, the eligibility verdict and the application checklist.
      # It stays off until SignPath Foundation accepts the project: every step
      # from here to the end of the job runs only on the Windows leg, and only
      # with vars.ENABLE_WINDOWS_SIGNING set to 'true'. With it unset they are
      # all skipped, and the Windows leg builds, attests and uploads through
      # tauri-action and the steps above, like every other leg.
      #
      # SignPath's free plan signs whole files, one approved request at a
      # time, and signing setup.exe does not sign the files inside it. So the
      # build is split around two signing requests: first the executables the
      # installers ship, then the installers built around the signed copies.
      #
      # The bundler writes the installer type into the app's executable as it
      # packs each installer. The first __TAURI_BUNDLE_TYPE_VAR_UNK becomes
      # __TAURI_BUNDLE_TYPE_VAR_NSS in the NSIS installer's copy and
      # __TAURI_BUNDLE_TYPE_VAR_MSI in the MSI's (patch_binary in Tauri's
      # crates/tauri-bundler/src/bundle.rs). The app reads it to choose its
      # update package (apps/desktop/src-tauri/src/updater.rs), and the write
      # would break a signature made before bundling. This step therefore
      # writes both stamped copies itself, in the same way, and the bundle step
      # passes --no-binary-patching so the bundler packs the signed copies as
      # they are. The installers also ship the package's other bin targets,
      # such as platevault-library, which the bundler packs unstamped.
      #
      # This copies Tauri CLI 2.12.2's bundler: marker, NSS/MSI stamp codes,
      # and get_binaries' rule. The CLI guard reads the apps/desktop lockfile
      # resolution before the build and rejects only a CLI version mismatch.
      # The Check step verifies installer signatures, the five NSIS plugin
      # pins, and the WiX publisher/issuer against the reviewed identities.
      # Recheck those when upgrading the CLI.
      #
      # The command is the one tauri-action runs on the other legs, `tauri
      # build` in apps/desktop with no extra arguments, with --no-bundle
      # added. The signing keys in tauri-action's env only write updater
      # signatures, which come later here.
      - name: Build the Windows app for signing
        id: windows-app
        if: runner.os == 'Windows' && vars.ENABLE_WINDOWS_SIGNING == 'true'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -File scripts/release/check-signed-installers.ps1 -Mode CliGuard -Lockfile (Join-Path (Get-Location).Path 'pnpm-lock.yaml')
          pnpm --dir apps/desktop exec tauri build --no-bundle

          # The bin targets Tauri packs into both installers: every bin of the
          # desktop_shell package that needs no feature, with default-run as the app.
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $package = $metadata.packages | Where-Object name -EQ 'desktop_shell'
          $main = $package.default_run ?? $package.name
          $others = @($package.targets |
            Where-Object { $_.kind -contains 'bin' -and -not $_.'required-features' -and $_.name -ne $main } |
            ForEach-Object name)
          $release = Join-Path $metadata.target_directory 'release'

          # The bundler stamps the first marker it finds. Refuse an executable
          # with none, or with more than one, rather than guess which counts.
          $marker = '__TAURI_BUNDLE_TYPE_VAR_UNK'
          $latin1 = [System.Text.Encoding]::Latin1
          $app = $latin1.GetString([System.IO.File]::ReadAllBytes((Join-Path $release "$main.exe")))
          $at = $app.IndexOf($marker, [System.StringComparison]::Ordinal)
          if ($at -lt 0 -or $app.IndexOf($marker, $at + 1, [System.StringComparison]::Ordinal) -ge 0) {
            throw "$main.exe must hold $marker exactly once"
          }
          $stamps = [ordered]@{ nsis = 'NSS'; msi = 'MSI' }
          foreach ($bundle in $stamps.Keys) {
            $dir = New-Item -ItemType Directory -Path "app-to-sign/$bundle"
            $stamped = $app.Remove($at, $marker.Length).Insert($at, "__TAURI_BUNDLE_TYPE_VAR_$($stamps[$bundle])")
            [System.IO.File]::WriteAllBytes((Join-Path $dir.FullName "$main.exe"), $latin1.GetBytes($stamped))
          }
          foreach ($bin in $others) {
            Copy-Item -LiteralPath (Join-Path $release "$bin.exe") -Destination app-to-sign
          }
          Get-ChildItem -Recurse -File app-to-sign | Format-Table -AutoSize Length, FullName

          "release_dir=$release" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "main_binary=$main" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      # SignPath takes the files as a GitHub artifact that this job uploaded.
      # overwrite: a re-run of a failed leg uploads under the same name again.
      - name: Upload the app executables for signing
        id: app-artifact
        if: runner.os == 'Windows' && vars.ENABLE_WINDOWS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-for-signing
          path: app-to-sign/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      # The SignPath organization, project, signing policy and the two artifact
      # configurations are set up in the SignPath dashboard once SignPath
      # Foundation accepts the project. Their IDs and slugs are not secrets: they
      # are repo Actions variables next to ENABLE_WINDOWS_SIGNING.
      #
      # Every request waits for an approver to approve it in SignPath, signed in
      # with MFA. The action's default wait, 600 s, gives the approver ten
      # minutes. 3600 s gives an hour for each of the two requests a release
      # makes. This job sets no timeout-minutes, so GitHub's six-hour job limit
      # applies, and the workflow's concurrency group never cancels a run in
      # progress (cancel-in-progress: false).
      #
      # The pin is the commit the v2 and v2.3 tags point at: the action's 2.3.0
      # in SignPath's changelog.
      - name: Sign the app executables (SignPath)
        if: runner.os == 'Windows' && vars.ENABLE_WINDOWS_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.app-artifact.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: app-signed

      # Packs each installer around SignPath's signed copies: the app stamped for
      # that installer, and the other executables. --no-binary-patching stops the
      # bundler from stamping the app again. --no-sign stops it from writing
      # updater signatures, which signing the installers would make stale; they
      # are written once the installers are final.
      #
      # Every file sent to SignPath must come back signed by SignPath
      # Foundation, or the unsigned copy left in the target directory would be
      # packed. A signature from any other certificate fails here, a SignPath
      # test-signing certificate included.
      - name: Bundle the installers around the signed executables
        if: runner.os == 'Windows' && vars.ENABLE_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          RELEASE_DIR: ${{ steps.windows-app.outputs.release_dir }}
          MAIN_BINARY: ${{ steps.windows-app.outputs.main_binary }}
          AUTHENTICODE_SIGNER: &authenticode-signer SignPath Foundation
          AUTHENTICODE_ISSUER: &authenticode-issuer GlobalSign GCC R45 CodeSigning CA 2020
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -File scripts/release/check-signed-installers.ps1 -Mode SignatureSet -SignatureBaseDirectory 'app-to-sign' -SignatureOutputDirectory 'app-signed' -AuthenticodeSigner $env:AUTHENTICODE_SIGNER -AuthenticodeIssuer $env:AUTHENTICODE_ISSUER
          Get-ChildItem -File -Filter '*.exe' app-signed | Copy-Item -Destination $env:RELEASE_DIR -Force
          foreach ($bundle in 'nsis', 'msi') {
            Copy-Item -LiteralPath "app-signed/$bundle/$env:MAIN_BINARY.exe" -Destination $env:RELEASE_DIR -Force
            pnpm --dir apps/desktop exec tauri bundle --bundles $bundle --no-binary-patching --no-sign
          }

          $setup = @(Get-ChildItem -File -Filter '*-setup.exe' (Join-Path $env:RELEASE_DIR 'bundle/nsis'))
          $msi = @(Get-ChildItem -File -Filter '*.msi' (Join-Path $env:RELEASE_DIR 'bundle/msi'))
          if ($setup.Count -ne 1 -or $msi.Count -ne 1) {
            throw "expected one setup.exe and one .msi, found: $((@($setup) + @($msi)).FullName -join ', ')"
          }
          New-Item -ItemType Directory -Path installers-to-sign | Out-Null
          Copy-Item -LiteralPath $setup[0].FullName, $msi[0].FullName -Destination installers-to-sign

      - name: Upload the installers for signing
        id: installer-artifact
        if: runner.os == 'Windows' && vars.ENABLE_WINDOWS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-for-signing
          path: installers-to-sign/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Sign the installers (SignPath)
        if: runner.os == 'Windows' && vars.ENABLE_WINDOWS_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.installer-artifact.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600 # an hour to approve, as for the request above
          output-artifact-directory: installers-signed

      # Fails the leg unless SignPath Foundation signed both installers and the
      # executables inside them match what SignPath signed, both ways round:
      # each installer carries every signed copy meant for it, byte for byte,
      # and every PE file (executable or DLL) found in an installer is one of
      # those copies or a third-party file listed in
      # scripts/release/check-signed-installers.ps1, and a reason for shipping
      # it without this project's signature. A bin target, sidecar or resource
      # added later fails here until it is signed or listed.
      # So does a list entry neither installer carries any more, and an
      # unpacked tree with no PE file in it, which means the unpacking failed
      # quietly and the scan proved nothing.
      #
      # 7-Zip unpacks the NSIS installer's files and, with -tCompound, the
      # MSI's streams, which hold its custom action DLLs. Without -tCompound,
      # 7-Zip opens the MSI's app.cab instead. Its exit code 1 is a warning,
      # such as data after the installer's end, which the signature is. An
      # administrative install (msiexec /a) unpacks the files the MSI
      # installs, without installing anything.
      #
      # Not covered: the uninstall.exe the NSIS installer writes into the
      # install folder. NSIS builds it from setup.exe's own stub while it
      # installs, so it is in no installer to check, and it stays unsigned
      # (docs/development/code-signing.md, "Known limits").
      - name: Check the signed installers
        if: runner.os == 'Windows' && vars.ENABLE_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          AUTHENTICODE_SIGNER: *authenticode-signer
          AUTHENTICODE_ISSUER: *authenticode-issuer
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -File scripts/release/check-signed-installers.ps1 -Mode Check -Lockfile (Join-Path (Get-Location).Path 'pnpm-lock.yaml') -InstallersToSignDirectory 'installers-to-sign' -InstallersSignedDirectory 'installers-signed' -AppSignedDirectory 'app-signed' -UnpackedDirectory 'unpacked'

      # minisign over the final bytes, which SignPath just rewrote: the same
      # format and key as the bundler's own updater signatures. --app-version
      # records the release version in the trusted comment, as the bundler does,
      # read from the tauri.conf.json the updater-manifest job announces in
      # latest.json. The in-app updater refuses an update whose signed version
      # differs from latest.json's, or whose signature carries no version, and
      # the updater-manifest job refuses to publish either.
      - name: Sign the signed installers for the updater
        if: runner.os == 'Windows' && vars.ENABLE_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content -Raw apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if (-not $version) { throw 'apps/desktop/src-tauri/tauri.conf.json has no version' }
          foreach ($installer in Get-ChildItem -File installers-signed | Where-Object Extension -In '.exe', '.msi') {
            pnpm --dir apps/desktop exec tauri signer sign --app-version $version $installer.FullName
          }

      # Provenance for the bytes the release carries, made after signing.
      - name: Attest the signed installers
        if: runner.os == 'Windows' && vars.ENABLE_WINDOWS_SIGNING == 'true'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            installers-signed/*.exe
            installers-signed/*.msi

      # tauri-action did not run on this leg, so this is the Windows bundles'
      # only upload. --clobber lets a re-run of a failed leg replace them.
      - name: Upload the signed installers to the release
        if: runner.os == 'Windows' && vars.ENABLE_WINDOWS_SIGNING == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "${TAG}" \
            installers-signed/*.exe installers-signed/*.msi \
            installers-signed/*.exe.sig installers-signed/*.msi.sig \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  # Writes latest.json, the manifest every installed copy polls through
  # releases/latest/download/latest.json. It runs only after every build leg has
  # succeeded, the Windows signing steps included when they are on. It refuses
  # to publish if a platform is missing, or if any updater signature fails
  # against the public key the app embeds, checked over the bytes on the
  # release. When a leg fails, the new release has no latest.json and the run is
  # red. Clients' update checks then fail, as they already do in the few minutes
  # between the release being created and the first leg finishing, rather than
  # some platforms silently missing the update. Re-running the failed jobs
  # finishes the release.
  updater-manifest:
    name: Publish updater manifest
    needs: [release-please, build]
    if: >-
      ${{ !cancelled()
        && needs.release-please.outputs.release_created == 'true'
        && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload latest.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the release's assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets,body > release.json
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir release-assets

      - name: Assemble and verify latest.json
        run: |
          node scripts/assemble-updater-manifest.mjs \
            --release release.json \
            --assets release-assets \
            --tauri-conf apps/desktop/src-tauri/tauri.conf.json \
            --out latest.json

      - name: Upload latest.json to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG}" latest.json --repo "${GITHUB_REPOSITORY}" --clobber

  # Submits the release to the Windows Package Manager community repository
  # (microsoft/winget-pkgs) as PlateVault.PlateVault with Komac, which writes
  # the new version's manifests and opens the pull request from the bot
  # account's winget-pkgs fork. It waits for updater-manifest, so the installers
  # are final. When enabled, SignPath replaces them before updater-manifest runs.
  # Each manifest pins installer SHA256 values, so an earlier submission could
  # publish stale hashes.
  #
  # Off unless vars.ENABLE_WINGET_PUBLISH is 'true'. `komac update` only adds
  # versions to a package that already exists in winget-pkgs, so the owner
  # turns this on after the first submission has merged
  # (docs/release/winget.md).
  #
  # Token isolation: WINGET_TOKEN is a classic personal access token (public_repo
  # and workflow scopes; fine-grained tokens cannot open the winget-pkgs pull
  # request) of a dedicated bot account, vars.WINGET_FORK_USER, that owns the
  # fork and has no write access to any platevault repository. Only the step
  # that runs Komac sees it. Komac is a pinned release binary checked against
  # its published SHA256, not a tool installed from a moving branch, and the
  # job checks out nothing.
  winget:
    name: Submit to winget
    needs: [release-please, updater-manifest]
    if: ${{ needs.release-please.outputs.release_created == 'true' && vars.ENABLE_WINGET_PUBLISH == 'true' }}
    # homebrew-bump.yml runs only when this whole workflow succeeds. A winget
    # failure (expired token, fork sync, API error) must not skip the cask bump:
    # the job still shows as failed, but the run concludes successfully.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read # gh api reads the release's assets with github.token
    env:
      KOMAC_VERSION: 2.16.0
      # SHA256 of komac-2.16.0-x86_64-unknown-linux-gnu.tar.gz, from the
      # release's SHA256SUMS (https://github.com/russellbanks/Komac/releases/tag/v2.16.0).
      KOMAC_SHA256: 7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d
    steps:
      - name: Check the winget configuration
        env:
          FORK_USER: ${{ vars.WINGET_FORK_USER }}
          HAS_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ -z "${FORK_USER}" ]; then
            echo "::error::ENABLE_WINGET_PUBLISH is 'true' but WINGET_FORK_USER is empty. Set it to the bot account that owns the winget-pkgs fork (docs/release/winget.md)."
            exit 1
          fi
          if [ "${HAS_TOKEN}" != "true" ]; then
            echo "::error::ENABLE_WINGET_PUBLISH is 'true' but the WINGET_TOKEN secret is empty."
            exit 1
          fi

      - name: Install Komac
        run: |
          set -euo pipefail
          tarball="komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          cd "${RUNNER_TEMP}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "${tarball}" \
            "https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}/${tarball}"
          echo "${KOMAC_SHA256}  ${tarball}" | sha256sum --check --strict
          mkdir komac
          tar -xzf "${tarball}" -C komac komac
          echo "${RUNNER_TEMP}/komac" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/komac/komac" --version

      # The NSIS per-user setup.exe and the MSI, not their .sig files.
      - name: Find the release's Windows installers
        id: installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          mapfile -t urls < <(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[] | select(.name | test("_x64(-setup\\.exe|_en-US\\.msi)$")) | .browser_download_url')
          if [ "${#urls[@]}" -ne 2 ]; then
            echo "::error::expected the x64 setup.exe and .msi on ${TAG}, found ${#urls[@]}: ${urls[*]:-none}"
            exit 1
          fi
          printf '%s\n' "${urls[@]}"
          {
            echo "version=${TAG#v}"
            echo "urls=${urls[*]}"
          } >> "${GITHUB_OUTPUT}"

      - name: Submit the manifest update to winget-pkgs
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          KOMAC_FORK_OWNER: ${{ vars.WINGET_FORK_USER }}
          VERSION: ${{ steps.installers.outputs.version }}
          URLS: ${{ steps.installers.outputs.urls }}
          FORCE_HYPERLINK: "0" # print the pull request URL as plain text
        run: |
          set -euo pipefail
          read -ra urls <<< "${URLS}"
          komac sync-fork
          komac update PlateVault.PlateVault --version "${VERSION}" --urls "${urls[@]}" --submit \
            | tee "${RUNNER_TEMP}/komac-update.log"
          pr_url="$(grep -Eo 'https://github\.com/microsoft/winget-pkgs/pull/[0-9]+' "${RUNNER_TEMP}/komac-update.log" | tail -n 1 || true)"
          echo "winget-pkgs pull request: ${pr_url:-not found in the Komac output}"
          echo "winget-pkgs pull request: ${pr_url:-not found in the Komac output}" >> "${GITHUB_STEP_SUMMARY}"
