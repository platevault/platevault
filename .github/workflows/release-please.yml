name: Release Please

# Maintains a release PR from Conventional Commits (feat/fix/...), updates
# CHANGELOG.md, bumps the desktop app version in three synced files
# (apps/desktop/src-tauri/tauri.conf.json, apps/desktop/package.json,
# apps/desktop/src-tauri/Cargo.toml), and tags a plain `v{version}` release on
# merge.
#
# This copy lives on release/0.6.x, the 0.6 maintenance branch cut from tag
# v0.6.0, and runs ONLY there. `target-branch` points release-please at this
# branch, so it reads this branch's config and manifest, scans only this
# branch's commits since v0.6.0, and opens its release PR against this
# branch. Main's release PR and manifest are untouched. A push to main runs
# main's own copy of this workflow, never this one.
#
# The release PR is verified by release-gate.yml, which posts the single
# "Release Gate / verdict" check the shepherd reads before merging.
#
# Once release-please tags+publishes a release (release_created == 'true'),
# the `build` job (spec 051 US10 / T060) builds the Tauri desktop app on the
# Windows/macOS/Linux matrix, signs the bundles + updater artifact with
# tauri-apps/tauri-action (minisign, via the TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]
# repo secrets), and uploads bundles and signatures to the release that
# release-please just created. The optional `sign-windows` job then replaces the
# Windows installers with Authenticode-signed copies. Last, `updater-manifest`
# writes the `latest.json` updater manifest, but only once every leg has
# succeeded and every updater signature verifies against the bytes on the
# release. This is what makes
# https://github.com/platevault/platevault/releases/latest/download/latest.json
# resolve for `tauri-plugin-updater`. The embedded public key that verifies
# these signatures lives in apps/desktop/src-tauri/tauri.conf.json and is
# owned by a separate US10 lane, not this workflow.

on:
  push:
    branches: [release/0.6.x]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_body: ${{ steps.release.outputs.body }}
    steps:
      # Mint a short-lived GitHub App installation token from the shared org
      # release app (contents:write + pull_requests:write). This is the
      # cross-org-correct identity: unlike a personal PAT it needs no org
      # approval and no lifetime management, and unlike the default GITHUB_TOKEN
      # its releases/tags DO trigger downstream workflows (release-gate on
      # `push: tags`) and its PR checks are not held as `action_required`.
      # Credentials are provisioned org-wide (visibility=all):
      #   RELEASE_APP_CLIENT_ID  — Actions variable
      #   RELEASE_APP_PRIVATE_KEY — Actions secret
      - name: Mint release-please app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: release/0.6.x

  build:
    name: Build & sign (${{ matrix.os }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false # report each platform distinctly, same as CI's integration matrix
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri's desktop_shell crate needs system webview libs to build AND
      # bundle (deb/rpm/AppImage) on Linux. patchelf is additionally required
      # for AppImage bundling, which ci.yml's plain `cargo build` never
      # exercises.
      - name: Install Tauri Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.os }}"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # macOS Developer ID signing and notarization, off unless
      # vars.ENABLE_MACOS_SIGNING is 'true' (docs/development/code-signing.md).
      # The Tauri bundler treats an APPLE_* variable that is set as a request to
      # sign, even when its value is empty. It checks `var_os("APPLE_CERTIFICATE")`,
      # which is Some("") for an empty value. The v0.6.0 macOS leg passed
      # `APPLE_CERTIFICATE: ''` and failed with "failed to import keychain
      # certificate". So the credentials are exported only when signing is on,
      # and only when every one of them is present. With signing off they are
      # never set, and the bundler ad-hoc signs as it did for v0.5.0.
      #
      # $GITHUB_ENV makes the values visible to the remaining steps of this leg,
      # including post-job steps. A step-level `env:` cannot leave a variable
      # unset, so there is no narrower scope.
      - name: Export macOS signing credentials
        if: runner.os == 'macOS' && vars.ENABLE_MACOS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          names='APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID'
          missing=''
          for name in $names; do
            if [ -z "${!name:-}" ]; then missing="${missing} ${name}"; fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::ENABLE_MACOS_SIGNING is 'true' but these are empty:${missing}. Set them, or unset ENABLE_MACOS_SIGNING to ship ad-hoc signed macOS builds."
            exit 1
          fi
          for name in $names; do
            delimiter="APPLE_EOF_$(openssl rand -hex 16)"
            printf '%s<<%s\n%s\n%s\n' "${name}" "${delimiter}" "${!name}" "${delimiter}" >> "$GITHUB_ENV"
          done

      # tauri-action auto-detects the package manager by checking for a
      # lockfile inside `projectPath` — apps/desktop has no pnpm-lock.yaml of
      # its own (it lives at the workspace root), so auto-detection would fall
      # through to `npm run tauri`. `tauriScript: pnpm tauri` pins it to the
      # same invocation the justfile already uses for `tauri dev`.
      #
      # includeUpdaterJson: false (tauri-action v0's name for v1's
      # uploadUpdaterJson). Each leg used to merge its own platform into the
      # release's latest.json as it finished. A failed leg then left a
      # published manifest without that platform (v0.6.0 shipped with no
      # darwin-* key). The `updater-manifest` job writes latest.json once the
      # whole release is built, so updaterJsonPreferNsis, which only shapes
      # that file, is gone too. Its NSIS preference now lives in
      # scripts/assemble-updater-manifest.mjs. v0 still uploads each bundle's
      # .sig as a release asset, because the .sig files are build artifacts.
      #
      # releaseDraft: false — release-please (the `release-please` job above)
      # already published a real (non-draft) GitHub Release for this tag, so
      # this step finds that release by tag and uploads bundles/signatures to
      # it directly.
      - name: Build, sign, and upload Tauri bundles
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseName: ${{ needs.release-please.outputs.tag_name }}
          releaseBody: ${{ needs.release-please.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      # The unsigned .exe/.msi the sign-windows job submits. tauri-action emits
      # artifactPaths as a JSON array STRING (its src/index.ts does
      # JSON.stringify(artifacts.map(a => a.path))). Reading it avoids hardcoding
      # bundle paths: filenames carry the version, and the bundle directory is
      # the workspace's cargo target dir (target/release/bundle), not
      # apps/desktop/src-tauri/target.
      - name: Collect unsigned Windows bundle paths
        id: windows-bundles
        if: ${{ runner.os == 'Windows' && vars.ENABLE_WINDOWS_SIGNING == 'true' }}
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          windows_bundles="$(printf '%s' "${ARTIFACT_PATHS:-[]}" | jq -r '.[] | select(endswith(".exe") or endswith(".msi"))')"
          if [ -z "${windows_bundles}" ]; then
            echo "::error::no .exe/.msi in artifactPaths; sign-windows would have nothing to sign"
            echo "artifactPaths was: ${ARTIFACT_PATHS:-<unset>}"
            exit 1
          fi
          {
            echo 'paths<<WINDOWS_BUNDLES_EOF'
            echo "${windows_bundles}"
            echo 'WINDOWS_BUNDLES_EOF'
          } >> "$GITHUB_OUTPUT"

      # Windows bundles above carry only the minisign updater signature, not an
      # Authenticode signature — Windows SmartScreen still shows "Unknown
      # Publisher" for the NSIS .exe and .msi. Collect them here so the
      # (currently disabled) sign-windows job below can submit them to
      # SignPath without needing its own build of the Tauri app.
      # Gated on the same var as sign-windows: with ENABLE_WINDOWS_SIGNING
      # unset, this step is skipped and the build job's effects are unchanged.
      - name: Collect unsigned Windows bundles
        if: ${{ runner.os == 'Windows' && vars.ENABLE_WINDOWS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-bundles
          path: ${{ steps.windows-bundles.outputs.paths }}
          if-no-files-found: error
          retention-days: 1

  # Authenticode-signs the Windows NSIS/MSI bundles via the SignPath
  # Foundation free OSS code-signing program (see
  # docs/development/code-signing.md for the research, eligibility
  # verdict, and application checklist). Disabled by default: SignPath
  # Foundation approval + the SIGNPATH_* secrets/vars below are required
  # before this can run, so it is gated on a repo Actions variable that is
  # unset until the application is approved and wired up. With the variable
  # unset, this job is skipped entirely and the release published by `build`
  # above is unchanged.
  #
  # The NSIS setup.exe and the .msi are also the Windows updater payloads, so
  # their minisign signatures have to be made over the Authenticode-signed bytes.
  # tauri-action's signatures cover the unsigned build output. This job therefore
  # signs them again after SignPath and replaces the bundle and its .sig
  # together. The updater-manifest job checks the result.
  sign-windows:
    name: Sign Windows bundles (SignPath)
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' && vars.ENABLE_WINDOWS_SIGNING == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # First, because checkout empties the workspace. The repo is only needed
      # for the pinned Tauri CLI (`tauri signer sign`) below.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Download unsigned Windows bundles
        uses: actions/download-artifact@v4
        with:
          name: windows-unsigned-bundles
          path: unsigned

      # The build leg's artifact keeps tauri's nsis/ and msi/ directories.
      # SignPath's artifact configuration is simpler with both files at the
      # root, and the steps below then find each signed file by name.
      - name: Flatten bundles for SignPath
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir to-sign
          find unsigned -type f \( -name '*.exe' -o -name '*.msi' \) -exec mv -- {} to-sign/ \;
          nsis_installers=(to-sign/*.exe)
          msi_installers=(to-sign/*.msi)
          if [ "${#nsis_installers[@]}" -eq 0 ] || [ "${#msi_installers[@]}" -eq 0 ]; then
            echo "::error::expected an .exe and an .msi in windows-unsigned-bundles"
            find unsigned to-sign -type f
            exit 1
          fi
          ls -l to-sign

      # Re-upload as a fresh workflow artifact: the SignPath action takes a
      # github-artifact-id from actions/upload-artifact in *this* job, it
      # cannot reference an artifact produced by a different job/id directly.
      - name: Re-upload bundles for SignPath submission
        id: upload-for-signing
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles-for-signing
          path: to-sign/
          retention-days: 1

      # project-slug/signing-policy-slug/artifact-configuration-slug are
      # created in the SignPath dashboard once the Foundation application is
      # approved (see the doc above) and are not secrets — set them as repo
      # Actions variables alongside ENABLE_WINDOWS_SIGNING.
      - name: Submit signing request to SignPath
        id: signpath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-for-signing.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # minisign over the final bytes: Authenticode just rewrote these files.
      # Writes signed/<file>.sig, the same format the bundler writes, from the same
      # key. Once @tauri-apps/cli is 2.12 or later, pass `--app-version` as well,
      # so the trusted comment carries the version the way the bundler's 2.12
      # signatures do. The updater's `requireSignedVersion` checks it.
      - name: Sign the signed bundles for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for submitted in to-sign/*; do
            name="$(basename -- "${submitted}")"
            if [ ! -f "signed/${name}" ]; then
              echo "::error::SignPath returned no signed/${name}. The artifact configuration must keep each file at the artifact root under its own name."
              exit 1
            fi
            pnpm --dir apps/desktop exec tauri signer sign "${PWD}/signed/${name}"
          done

      # tauri-action already uploaded unsigned copies of these files, with
      # signatures over the unsigned bytes, to the release in the `build` job.
      # --clobber replaces each bundle and its .sig in the same upload.
      - name: Upload signed bundles to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "${TAG}" \
            signed/*.exe signed/*.msi signed/*.exe.sig signed/*.msi.sig \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  # Writes latest.json, the manifest every installed copy polls through
  # releases/latest/download/latest.json. It runs only after every build leg
  # (and sign-windows, when enabled) has succeeded. It refuses to publish if a
  # platform is missing, or if any updater signature fails against the public
  # key the app embeds, checked over the bytes on the release. When a leg fails,
  # the new release has no latest.json and the run is red. Clients' update
  # checks then fail, as they already do in the few minutes between the release
  # being created and the first leg finishing, rather than some platforms
  # silently missing the update. Re-running the failed jobs finishes the release.
  updater-manifest:
    name: Publish updater manifest
    needs: [release-please, build, sign-windows]
    if: >-
      ${{ !cancelled()
        && needs.release-please.outputs.release_created == 'true'
        && needs.build.result == 'success'
        && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload latest.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the release's assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets,body > release.json
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir release-assets

      - name: Assemble and verify latest.json
        run: |
          node scripts/assemble-updater-manifest.mjs \
            --release release.json \
            --assets release-assets \
            --tauri-conf apps/desktop/src-tauri/tauri.conf.json \
            --out latest.json

      - name: Upload latest.json to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG}" latest.json --repo "${GITHUB_REPOSITORY}" --clobber
