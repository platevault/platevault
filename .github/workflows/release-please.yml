name: Release Please

# Maintains a release PR from Conventional Commits (feat/fix/...), updates
# CHANGELOG.md, bumps the desktop app version in three synced files
# (apps/desktop/src-tauri/tauri.conf.json, apps/desktop/package.json,
# apps/desktop/src-tauri/Cargo.toml), and tags a plain `v{version}` release on
# merge. Runs ONLY on main: releases are cut from main, never from the
# redesign integration branch. The first release PR appears once this config
# lands on main (via #349) and a subsequent feat/fix is pushed.
#
# The release PR is verified by release-gate.yml, whose required "Release
# Gate" check the shepherd reads before merging.
#
# release-please runs in two places. The `release-please` job only maintains
# the release PR. When a push to main is a release PR's merge, the `release`
# job waits for an approver on the `release` environment, checks that the
# commit came from a release candidate that passed
# (scripts/release/check-rc-provenance.mjs, docs/release/release-candidates.md),
# and only then has release-please tag and publish the release.
# Then the `build` job (spec 051 US10 / T060, in
# build-installers.yml, which release candidates use too) build the Tauri
# desktop app on the Windows/macOS/Linux matrix, sign the bundles + updater
# artifact with tauri-apps/tauri-action (minisign, via the
# TAURI_SIGNING_PRIVATE_KEY[_PASSWORD] repo secrets), and upload bundles and
# signatures to the release that release-please just created. With
# vars.ENABLE_WINDOWS_SIGNING on, the Windows leg instead builds its installers
# around executables SignPath has Authenticode-signed, and has SignPath sign
# the installers before it uploads them. Last, `updater-manifest` writes the
# `latest.json` updater manifest, but only once every leg has succeeded and
# every updater signature verifies against the bytes on the release. This is
# what makes
# https://github.com/platevault/platevault/releases/latest/download/latest.json
# resolve for the in-app updater: the services-crate client (0.7.0 on) and
# tauri-plugin-updater in 0.5.x/0.6.x installs read the same file, so every
# release keeps every platform key. The embedded public key that verifies
# these signatures lives in apps/desktop/src-tauri/tauri.conf.json and is
# owned by a separate US10 lane, not this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  statuses: read # the provenance check reads the candidate's release/rc status

concurrency:
  group: updater-latest-json
  cancel-in-progress: false

jobs:
  # Keeps the release PR up to date and nothing else: it never publishes a
  # release. `release` below does that, once the provenance check passes.
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_commit: ${{ steps.release-commit.outputs.release_commit }}
      version: ${{ steps.release-commit.outputs.version }}
    steps:
      # Mint a short-lived GitHub App installation token from the shared org
      # release app (contents:write + pull_requests:write). This is the
      # cross-org-correct identity: unlike a personal PAT it needs no org
      # approval and no lifetime management, and unlike the default GITHUB_TOKEN
      # its releases/tags DO trigger downstream workflows (release-gate on
      # `push: tags`) and its PR checks are not held as `action_required`.
      # Credentials are provisioned org-wide (visibility=all):
      #   RELEASE_APP_CLIENT_ID  — Actions variable
      #   RELEASE_APP_PRIVATE_KEY — Actions secret
      - name: Mint release-please app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Maintain the release PR
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The merged release PR still labelled `autorelease: pending` is the
      # release to publish; its merge commit is the commit to release. Only
      # the run for that commit may publish it, because the provenance check
      # and the build use the run's commit. Another run (its own was cancelled
      # in the concurrency queue, or main moved on) fails loudly and names the
      # run to re-run, rather than leaving the release unpublished in silence.
      - name: Is this a release PR's merge?
        id: release-commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r '.["."]' .release-please-manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          pending=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state merged \
            --label 'autorelease: pending' --json number,mergeCommit \
            --jq '.[] | "\(.number) \(.mergeCommit.oid)"')
          if [ -z "$pending" ]; then
            echo "release_commit=false" >> "$GITHUB_OUTPUT"
            echo "No merged release PR waits to be published."
            exit 0
          fi
          while read -r number commit; do
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "release_commit=true" >> "$GITHUB_OUTPUT"
              echo "Release commit: release PR #${number} merged as ${commit}, version ${version}."
              exit 0
            fi
          done <<< "$pending"
          while read -r number commit; do
            echo "::error::Release PR #${number} merged as ${commit} is not published yet. Re-run the Release Please run for ${commit} (docs/release/release-candidates.md)."
          done <<< "$pending"
          exit 1

  # Publishes vX.Y.Z, but only from a passed release candidate
  # (docs/release/release-candidates.md). The `release` environment holds the
  # job for an approver before anything is published, and the provenance check
  # runs before release-please creates the release. A refusal publishes
  # nothing: the merged release PR keeps `autorelease: pending`, and installed
  # copies keep the previous release. Release Gate runs the same check on the
  # release PR, but it can test an older merge result (branch protection does
  # not require PRs to be up to date, and release-please leaves its PR alone
  # for commits the changelog hides), so this check is the one that decides.
  release:
    name: Release
    needs: release-please
    if: needs.release-please.outputs.release_commit == 'true'
    runs-on: ubuntu-latest
    environment: release
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # The body with the code signing policy link (see the `notes` step),
      # or release-please's own body if that step wrote none.
      release_body: ${{ steps.notes.outputs.body || steps.release.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the commit came from a passed release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --force --quiet origin 'refs/tags/rc/*:refs/tags/rc/*'
          node scripts/release/check-rc-provenance.mjs --version "${VERSION}" --commit "${GITHUB_SHA}"

      - name: Mint release-please app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Publish the release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # SignPath Foundation's conditions (https://signpath.org/terms.html) ask
      # for a "Code signing policy" link on every release page. release-please
      # has no release-notes footer option (its config schema offers only
      # pull-request-header and pull-request-footer), so this step appends the
      # link to the body release-please wrote and saves it to the release. The
      # build job passes the same body to tauri-action, so no leg drops it.
      # The output is written first and the edit is best-effort: if the edit
      # fails, tauri-action still saves the linked body when the first build
      # leg updates the release, and the release itself goes ahead.
      - name: Link the code signing policy from the release notes
        id: notes
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_PLEASE_BODY: ${{ steps.release.outputs.body }}
        run: |
          set -euo pipefail
          body="$(printf '%s\n\n%s' "${RELEASE_PLEASE_BODY}" \
            '[Code signing policy](https://github.com/platevault/platevault/blob/main/docs/release/code-signing-policy.md)')"
          delimiter="BODY_$(openssl rand -hex 16)"
          printf 'body<<%s\n%s\n%s\n' "${delimiter}" "${body}" "${delimiter}" >> "${GITHUB_OUTPUT}"
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes "${body}" \
            || echo "::warning::could not add the code signing policy link to ${TAG} now; the build legs save it through tauri-action"

  build:
    name: Build & sign
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/build-installers.yml
    permissions:
      contents: write # tauri-action publishes the release and uploads bundles
      id-token: write # OIDC identity that signs the attestation
      attestations: write # publish the attestation to this repo
      actions: read # the SignPath connector reads the job's artifacts
    secrets: inherit
    with:
      tag_name: ${{ needs.release.outputs.tag_name }}
      release_body: ${{ needs.release.outputs.release_body }}
      prerelease: false

  # Writes latest.json, the manifest every installed copy polls through
  # releases/latest/download/latest.json. It runs only after every build leg has
  # succeeded, the Windows signing steps included when they are on. It refuses
  # to publish if a platform is missing, or if any updater signature fails
  # against the public key the app embeds, checked over the bytes on the
  # release. When a leg fails, the new release has no latest.json and the run is
  # red. Clients' update checks then fail, as they already do in the few minutes
  # between the release being created and the first leg finishing, rather than
  # some platforms silently missing the update. Re-running the failed jobs
  # finishes the release.
  updater-manifest:
    name: Publish updater manifest
    needs: [release, build]
    if: >-
      ${{ !cancelled()
        && needs.release.outputs.release_created == 'true'
        && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload latest.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the release's assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets,body > release.json
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir release-assets
          mkdir -p previous-release
          gh release download --repo "${GITHUB_REPOSITORY}" --pattern latest.json --dir previous-release
          cp previous-release/latest.json previous-latest.json

      - name: Assemble and verify latest.json
        run: |
          node scripts/assemble-updater-manifest.mjs \
            --release release.json \
            --assets release-assets \
            --tauri-conf apps/desktop/src-tauri/tauri.conf.json \
            --previous-manifest previous-latest.json \
            --out latest.json

      - name: Upload latest.json to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: gh release upload "${TAG}" latest.json --repo "${GITHUB_REPOSITORY}" --clobber

  # Submits the release to the Windows Package Manager community repository
  # (microsoft/winget-pkgs) as PlateVault.PlateVault with Komac, which writes
  # the new version's manifests and opens the pull request from the bot
  # account's winget-pkgs fork. It waits for updater-manifest, so the installers
  # are final. When enabled, SignPath replaces them before updater-manifest runs.
  # Each manifest pins installer SHA256 values, so an earlier submission could
  # publish stale hashes.
  #
  # Off unless vars.ENABLE_WINGET_PUBLISH is 'true'. `komac update` only adds
  # versions to a package that already exists in winget-pkgs, so the owner
  # turns this on after the first submission has merged
  # (docs/release/winget.md).
  #
  # Token isolation: WINGET_TOKEN is a classic personal access token (public_repo
  # and workflow scopes; fine-grained tokens cannot open the winget-pkgs pull
  # request) of a dedicated bot account, vars.WINGET_FORK_USER, that owns the
  # fork and has no write access to any platevault repository. Only the step
  # that runs Komac sees it. Komac is a pinned release binary checked against
  # its published SHA256, not a tool installed from a moving branch, and the
  # job checks out nothing.
  winget:
    name: Submit to winget
    needs: [release, updater-manifest]
    if: ${{ needs.release.outputs.release_created == 'true' && vars.ENABLE_WINGET_PUBLISH == 'true' }}
    # homebrew-bump.yml runs only when this whole workflow succeeds. A winget
    # failure (expired token, fork sync, API error) must not skip the cask bump:
    # the job still shows as failed, but the run concludes successfully.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read # gh api reads the release's assets with github.token
    env:
      KOMAC_VERSION: 2.16.0
      # SHA256 of komac-2.16.0-x86_64-unknown-linux-gnu.tar.gz, from the
      # release's SHA256SUMS (https://github.com/russellbanks/Komac/releases/tag/v2.16.0).
      KOMAC_SHA256: 7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d
    steps:
      - name: Check the winget configuration
        env:
          FORK_USER: ${{ vars.WINGET_FORK_USER }}
          HAS_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ -z "${FORK_USER}" ]; then
            echo "::error::ENABLE_WINGET_PUBLISH is 'true' but WINGET_FORK_USER is empty. Set it to the bot account that owns the winget-pkgs fork (docs/release/winget.md)."
            exit 1
          fi
          if [ "${HAS_TOKEN}" != "true" ]; then
            echo "::error::ENABLE_WINGET_PUBLISH is 'true' but the WINGET_TOKEN secret is empty."
            exit 1
          fi

      - name: Install Komac
        run: |
          set -euo pipefail
          tarball="komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          cd "${RUNNER_TEMP}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "${tarball}" \
            "https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}/${tarball}"
          echo "${KOMAC_SHA256}  ${tarball}" | sha256sum --check --strict
          mkdir komac
          tar -xzf "${tarball}" -C komac komac
          echo "${RUNNER_TEMP}/komac" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/komac/komac" --version

      # The NSIS per-user setup.exe and the MSI, not their .sig files.
      - name: Find the release's Windows installers
        id: installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          mapfile -t urls < <(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[] | select(.name | test("_x64(-setup\\.exe|_en-US\\.msi)$")) | .browser_download_url')
          if [ "${#urls[@]}" -ne 2 ]; then
            echo "::error::expected the x64 setup.exe and .msi on ${TAG}, found ${#urls[@]}: ${urls[*]:-none}"
            exit 1
          fi
          printf '%s\n' "${urls[@]}"
          {
            echo "version=${TAG#v}"
            echo "urls=${urls[*]}"
          } >> "${GITHUB_OUTPUT}"

      - name: Submit the manifest update to winget-pkgs
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          KOMAC_FORK_OWNER: ${{ vars.WINGET_FORK_USER }}
          VERSION: ${{ steps.installers.outputs.version }}
          URLS: ${{ steps.installers.outputs.urls }}
          FORCE_HYPERLINK: "0" # print the pull request URL as plain text
        run: |
          set -euo pipefail
          read -ra urls <<< "${URLS}"
          komac sync-fork
          komac update PlateVault.PlateVault --version "${VERSION}" --urls "${urls[@]}" --submit \
            | tee "${RUNNER_TEMP}/komac-update.log"
          pr_url="$(grep -Eo 'https://github\.com/microsoft/winget-pkgs/pull/[0-9]+' "${RUNNER_TEMP}/komac-update.log" | tail -n 1 || true)"
          echo "winget-pkgs pull request: ${pr_url:-not found in the Komac output}"
          echo "winget-pkgs pull request: ${pr_url:-not found in the Komac output}" >> "${GITHUB_STEP_SUMMARY}"
