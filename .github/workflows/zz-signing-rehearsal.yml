name: Windows signing rehearsal (throwaway, never merged)
on:
  push:
    branches:
    - chore/signing-rehearsal
permissions:
  contents: read
jobs:
  probe:
    name: Probe 7-Zip on an MSI
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - name: Download the v0.6.1 MSI
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download v0.6.1 --repo platevault/platevault --pattern 'PlateVault_0.6.1_x64_en-US.msi'
        7z i | Select-Object -First 3
    - name: Default open
      shell: pwsh
      run: |
        7z l PlateVault_0.6.1_x64_en-US.msi
    - name: Compound type only
      shell: pwsh
      run: |
        7z l -tCompound PlateVault_0.6.1_x64_en-US.msi
        7z x -tCompound PlateVault_0.6.1_x64_en-US.msi -oout-compound -y | Out-Null
        "exit $LASTEXITCODE"
        Get-ChildItem -Recurse -File out-compound | Format-Table -AutoSize Length, Name
    - name: Binary table through Windows Installer
      shell: pwsh
      run: |
        $installer = New-Object -ComObject WindowsInstaller.Installer
        $db = $installer.OpenDatabase((Resolve-Path PlateVault_0.6.1_x64_en-US.msi).Path, 0)
        $view = $db.OpenView('SELECT `Name` FROM `Binary`')
        $view.Execute()
        while ($record = $view.Fetch()) { $record.StringData(1) }
