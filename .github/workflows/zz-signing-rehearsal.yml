name: Windows signing rehearsal (throwaway, never merged)
on:
  push:
    branches:
    - chore/signing-rehearsal-2
permissions:
  contents: read
jobs:
  rehearse:
    name: Rehearse Windows signing
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.99.0
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: release-windows-latest
        save-if: false
    - uses: pnpm/action-setup@v6
      with:
        version: 11.17.0
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - name: Install JS dependencies
      run: pnpm install --frozen-lockfile
    - name: 'Rehearsal: trust a throwaway code-signing certificate'
      shell: pwsh
      run: |
        $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=PlateVault signing rehearsal' -CertStoreLocation Cert:\CurrentUser\My
        foreach ($name in 'Root', 'TrustedPublisher') {
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new($name, 'LocalMachine')
          $store.Open('ReadWrite'); $store.Add($cert); $store.Close()
        }
    - name: 'Rehearsal: throwaway updater key'
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $key = Join-Path $env:RUNNER_TEMP 'rehearsal.key'
        pnpm --dir apps/desktop exec tauri signer generate --ci --password rehearsal --write-keys $key
        "TAURI_SIGNING_PRIVATE_KEY=$((Get-Content -Raw $key).Trim())" | Add-Content -LiteralPath $env:GITHUB_ENV
        'TAURI_SIGNING_PRIVATE_KEY_PASSWORD=rehearsal' | Add-Content -LiteralPath $env:GITHUB_ENV
    - name: Build the Windows app for signing
      id: windows-app
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        pnpm --dir apps/desktop exec tauri build --no-bundle

        # The bin targets Tauri packs into both installers: every bin of the
        # desktop_shell package that needs no feature, with default-run as the app.
        $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
        $package = $metadata.packages | Where-Object name -EQ 'desktop_shell'
        $main = $package.default_run ?? $package.name
        $others = @($package.targets |
          Where-Object { $_.kind -contains 'bin' -and -not $_.'required-features' -and $_.name -ne $main } |
          ForEach-Object name)
        $release = Join-Path $metadata.target_directory 'release'

        # The bundler stamps the first marker it finds. Refuse an executable
        # with none, or with more than one, rather than guess which counts.
        $marker = '__TAURI_BUNDLE_TYPE_VAR_UNK'
        $latin1 = [System.Text.Encoding]::Latin1
        $app = $latin1.GetString([System.IO.File]::ReadAllBytes((Join-Path $release "$main.exe")))
        $at = $app.IndexOf($marker, [System.StringComparison]::Ordinal)
        if ($at -lt 0 -or $app.IndexOf($marker, $at + 1, [System.StringComparison]::Ordinal) -ge 0) {
          throw "$main.exe must hold $marker exactly once"
        }
        $stamps = [ordered]@{ nsis = 'NSS'; msi = 'MSI' }
        foreach ($bundle in $stamps.Keys) {
          $dir = New-Item -ItemType Directory -Path "app-to-sign/$bundle"
          $stamped = $app.Remove($at, $marker.Length).Insert($at, "__TAURI_BUNDLE_TYPE_VAR_$($stamps[$bundle])")
          [System.IO.File]::WriteAllBytes((Join-Path $dir.FullName "$main.exe"), $latin1.GetBytes($stamped))
        }
        foreach ($bin in $others) {
          Copy-Item -LiteralPath (Join-Path $release "$bin.exe") -Destination app-to-sign
        }
        Get-ChildItem -Recurse -File app-to-sign | Format-Table -AutoSize Length, FullName

        "release_dir=$release" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
        "main_binary=$main" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
    - name: Upload the app executables for signing
      id: app-artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-app-for-signing
        path: app-to-sign/
        if-no-files-found: error
        overwrite: true
        retention-days: 1
    - name: 'Rehearsal stand-in for SignPath: app-to-sign -> app-signed'
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        Copy-Item -Recurse app-to-sign app-signed
        $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Where-Object Subject -EQ 'CN=PlateVault signing rehearsal'
        foreach ($file in Get-ChildItem -Recurse -File app-signed) {
          $result = Set-AuthenticodeSignature -LiteralPath $file.FullName -Certificate $cert -HashAlgorithm SHA256
          "$($file.FullName): $($result.Status)"
        }
    - name: Bundle the installers around the signed executables
      shell: pwsh
      env:
        RELEASE_DIR: ${{ steps.windows-app.outputs.release_dir }}
        MAIN_BINARY: ${{ steps.windows-app.outputs.main_binary }}
        AUTHENTICODE_SIGNER: PlateVault signing rehearsal
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $submitted = (Resolve-Path app-to-sign).Path
        foreach ($file in Get-ChildItem -Recurse -File app-to-sign) {
          $relative = [System.IO.Path]::GetRelativePath($submitted, $file.FullName)
          $signed = Join-Path app-signed $relative
          if (-not (Test-Path -LiteralPath $signed -PathType Leaf)) {
            throw "SignPath returned no $signed. The app artifact configuration must keep each file at its path."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $signed
          $signer = if ($signature.SignerCertificate) { $signature.SignerCertificate.GetNameInfo('SimpleName', $false) }
          if ($signature.Status -ne 'Valid' -or $signer -cne $env:AUTHENTICODE_SIGNER) {
            throw "$signed must carry a valid signature by $env:AUTHENTICODE_SIGNER, found: $($signature.Status) by '$signer'. $($signature.StatusMessage)"
          }
        }

        Get-ChildItem -File -Filter '*.exe' app-signed | Copy-Item -Destination $env:RELEASE_DIR -Force
        foreach ($bundle in 'nsis', 'msi') {
          Copy-Item -LiteralPath "app-signed/$bundle/$env:MAIN_BINARY.exe" -Destination $env:RELEASE_DIR -Force
          pnpm --dir apps/desktop exec tauri bundle --bundles $bundle --no-binary-patching --no-sign
        }

        $setup = @(Get-ChildItem -File -Filter '*-setup.exe' (Join-Path $env:RELEASE_DIR 'bundle/nsis'))
        $msi = @(Get-ChildItem -File -Filter '*.msi' (Join-Path $env:RELEASE_DIR 'bundle/msi'))
        if ($setup.Count -ne 1 -or $msi.Count -ne 1) {
          throw "expected one setup.exe and one .msi, found: $((@($setup) + @($msi)).FullName -join ', ')"
        }
        New-Item -ItemType Directory -Path installers-to-sign | Out-Null
        Copy-Item -LiteralPath $setup[0].FullName, $msi[0].FullName -Destination installers-to-sign
    - name: Upload the installers for signing
      id: installer-artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-installers-for-signing
        path: installers-to-sign/
        if-no-files-found: error
        overwrite: true
        retention-days: 1
    - name: 'Rehearsal stand-in for SignPath: installers-to-sign -> installers-signed'
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        Copy-Item -Recurse installers-to-sign installers-signed
        $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Where-Object Subject -EQ 'CN=PlateVault signing rehearsal'
        foreach ($file in Get-ChildItem -Recurse -File installers-signed) {
          $result = Set-AuthenticodeSignature -LiteralPath $file.FullName -Certificate $cert -HashAlgorithm SHA256
          "$($file.FullName): $($result.Status)"
        }
    - name: Check the signed installers
      shell: pwsh
      env:
        AUTHENTICODE_SIGNER: PlateVault signing rehearsal
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        foreach ($installer in Get-ChildItem -File installers-to-sign) {
          $signed = Join-Path installers-signed $installer.Name
          if (-not (Test-Path -LiteralPath $signed -PathType Leaf)) {
            throw "SignPath returned no $signed. The installer artifact configuration must keep each file at the artifact root."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $signed
          $signer = if ($signature.SignerCertificate) { $signature.SignerCertificate.GetNameInfo('SimpleName', $false) }
          if ($signature.Status -ne 'Valid' -or $signer -cne $env:AUTHENTICODE_SIGNER) {
            throw "$signed must carry a valid signature by $env:AUTHENTICODE_SIGNER, found: $($signature.Status) by '$signer'. $($signature.StatusMessage)"
          }
        }

        function Expand-With7Zip([string] $archive, [string] $destination, [string[]] $options = @()) {
          & {
            $PSNativeCommandUseErrorActionPreference = $false
            7z x @options $archive "-o$destination" -y | Out-Null
          }
          if ($LASTEXITCODE -gt 1) { throw "7-Zip could not unpack ${archive}: exit code $LASTEXITCODE" }
        }
        $setup = Get-Item installers-signed/*-setup.exe
        $msi = Get-Item installers-signed/*.msi
        Expand-With7Zip $setup.FullName "$PWD\unpacked\nsis"
        Expand-With7Zip $msi.FullName "$PWD\unpacked\msi-streams" -options '-tCompound'
        $admin = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$PWD\unpacked\msi`""
        if ($admin.ExitCode -ne 0) { throw "msiexec /a $($msi.Name) exited with $($admin.ExitCode)" }

        # Signed copies meant for each installer, and the unpacked trees each
        # installer's PE files are searched in.
        $signedFor = @{}
        foreach ($bundle in 'nsis', 'msi') {
          $signedFor[$bundle] = @(Get-ChildItem -File "app-signed/$bundle") + @(Get-ChildItem -File -Filter '*.exe' app-signed)
          foreach ($file in $signedFor[$bundle]) {
            $packed = @(Get-ChildItem -Recurse -File -Filter $file.Name "unpacked/$bundle")
            if ($packed.Count -ne 1) {
              throw "expected one $($file.Name) in the $bundle installer, found $($packed.Count)"
            }
            if ((Get-FileHash -LiteralPath $packed[0].FullName).Hash -ne (Get-FileHash -LiteralPath $file.FullName).Hash) {
              throw "the $bundle installer's $($file.Name) is not the copy SignPath signed"
            }
            "the $bundle installer carries the signed $($file.Name)"
          }
        }
        $trees = [ordered]@{ nsis = 'nsis'; msi = 'msi'; 'msi-streams' = 'msi' }

        # Third-party code in the installers. SignPath Foundation signs only
        # files built from this repository, so these keep their own
        # signatures, if any. Paths are relative to unpacked/.
        $nsisPlugin = 'NSIS plugin: third-party code that setup.exe extracts to a temporary folder and loads while it runs; not installed'
        $wixAction = 'WiX custom action: third-party code that msiexec runs while it installs; not installed'
        $thirdParty = [ordered]@{
          'nsis/$PLUGINSDIR/nsDialogs.dll' = $nsisPlugin
          'nsis/$PLUGINSDIR/nsis_tauri_utils.dll' = $nsisPlugin
          'nsis/$PLUGINSDIR/NSISdl.dll' = $nsisPlugin
          'nsis/$PLUGINSDIR/StartMenu.dll' = $nsisPlugin
          'nsis/$PLUGINSDIR/System.dll' = $nsisPlugin
          'msi-streams/Binary.WixUIWixca' = $wixAction
        }

        function Test-PortableExecutable([string] $path) {
          $stream = [System.IO.File]::OpenRead($path)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            if ($stream.Length -lt 64 -or $reader.ReadUInt16() -ne 0x5A4D) { return $false }
            $stream.Position = 0x3C
            $header = [long]$reader.ReadUInt32()
            if ($header + 4 -gt $stream.Length) { return $false }
            $stream.Position = $header
            return $reader.ReadUInt32() -eq 0x00004550
          } finally {
            $stream.Dispose()
          }
        }

        $unpacked = (Resolve-Path unpacked).Path
        $problems = @()
        $listed = @()
        foreach ($tree in $trees.Keys) {
          $signedHashes = @($signedFor[$trees[$tree]] | ForEach-Object { (Get-FileHash -LiteralPath $_.FullName).Hash })
          $scanned = 0
          $files = if (Test-Path -LiteralPath "unpacked/$tree") { Get-ChildItem -Recurse -File "unpacked/$tree" } else { @() }
          foreach ($file in $files) {
            if (-not (Test-PortableExecutable $file.FullName)) { continue }
            $scanned++
            $relative = [System.IO.Path]::GetRelativePath($unpacked, $file.FullName).Replace('\', '/')
            if ((Get-FileHash -LiteralPath $file.FullName).Hash -in $signedHashes) {
              "signed by SignPath: $relative"
            } elseif ($thirdParty.Contains($relative)) {
              $listed += $relative
              $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
              $signer = if ($signature.SignerCertificate) { $signature.SignerCertificate.GetNameInfo('SimpleName', $false) } else { 'nobody' }
              "third-party: $relative ($($thirdParty[$relative])); Authenticode $($signature.Status), signed by $signer"
            } else {
              $problems += "$relative was not signed by SignPath and is not on the third-party list"
            }
          }
          "unpacked/${tree}: $scanned PE files"
          if ($scanned -eq 0) {
            $problems += "unpacked/$tree holds no PE file, so its unpacking failed and nothing in it was checked"
          }
        }
        foreach ($entry in $thirdParty.Keys | Where-Object { $_ -notin $listed }) {
          $problems += "$entry is on the third-party list but in neither installer; remove it from the list in release-please.yml"
        }
        if ($problems) {
          throw "the installers failed the check:`n$($problems -join "`n")"
        }
    - name: 'Rehearsal: the check fails on each broken input'
      shell: pwsh
      env:
        CHECK_SCRIPT: |
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($installer in Get-ChildItem -File installers-to-sign) {
            $signed = Join-Path installers-signed $installer.Name
            if (-not (Test-Path -LiteralPath $signed -PathType Leaf)) {
              throw "SignPath returned no $signed. The installer artifact configuration must keep each file at the artifact root."
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $signed
            $signer = if ($signature.SignerCertificate) { $signature.SignerCertificate.GetNameInfo('SimpleName', $false) }
            if ($signature.Status -ne 'Valid' -or $signer -cne $env:AUTHENTICODE_SIGNER) {
              throw "$signed must carry a valid signature by $env:AUTHENTICODE_SIGNER, found: $($signature.Status) by '$signer'. $($signature.StatusMessage)"
            }
          }

          function Expand-With7Zip([string] $archive, [string] $destination, [string[]] $options = @()) {
            & {
              $PSNativeCommandUseErrorActionPreference = $false
              7z x @options $archive "-o$destination" -y | Out-Null
            }
            if ($LASTEXITCODE -gt 1) { throw "7-Zip could not unpack ${archive}: exit code $LASTEXITCODE" }
          }
          $setup = Get-Item installers-signed/*-setup.exe
          $msi = Get-Item installers-signed/*.msi
          Expand-With7Zip $setup.FullName "$PWD\unpacked\nsis"
          Expand-With7Zip $msi.FullName "$PWD\unpacked\msi-streams" -options '-tCompound'
          $admin = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$PWD\unpacked\msi`""
          if ($admin.ExitCode -ne 0) { throw "msiexec /a $($msi.Name) exited with $($admin.ExitCode)" }

          # Signed copies meant for each installer, and the unpacked trees each
          # installer's PE files are searched in.
          $signedFor = @{}
          foreach ($bundle in 'nsis', 'msi') {
            $signedFor[$bundle] = @(Get-ChildItem -File "app-signed/$bundle") + @(Get-ChildItem -File -Filter '*.exe' app-signed)
            foreach ($file in $signedFor[$bundle]) {
              $packed = @(Get-ChildItem -Recurse -File -Filter $file.Name "unpacked/$bundle")
              if ($packed.Count -ne 1) {
                throw "expected one $($file.Name) in the $bundle installer, found $($packed.Count)"
              }
              if ((Get-FileHash -LiteralPath $packed[0].FullName).Hash -ne (Get-FileHash -LiteralPath $file.FullName).Hash) {
                throw "the $bundle installer's $($file.Name) is not the copy SignPath signed"
              }
              "the $bundle installer carries the signed $($file.Name)"
            }
          }
          $trees = [ordered]@{ nsis = 'nsis'; msi = 'msi'; 'msi-streams' = 'msi' }

          # Third-party code in the installers. SignPath Foundation signs only
          # files built from this repository, so these keep their own
          # signatures, if any. Paths are relative to unpacked/.
          $nsisPlugin = 'NSIS plugin: third-party code that setup.exe extracts to a temporary folder and loads while it runs; not installed'
          $wixAction = 'WiX custom action: third-party code that msiexec runs while it installs; not installed'
          $thirdParty = [ordered]@{
            'nsis/$PLUGINSDIR/nsDialogs.dll' = $nsisPlugin
            'nsis/$PLUGINSDIR/nsis_tauri_utils.dll' = $nsisPlugin
            'nsis/$PLUGINSDIR/NSISdl.dll' = $nsisPlugin
            'nsis/$PLUGINSDIR/StartMenu.dll' = $nsisPlugin
            'nsis/$PLUGINSDIR/System.dll' = $nsisPlugin
            'msi-streams/Binary.WixUIWixca' = $wixAction
          }

          function Test-PortableExecutable([string] $path) {
            $stream = [System.IO.File]::OpenRead($path)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              if ($stream.Length -lt 64 -or $reader.ReadUInt16() -ne 0x5A4D) { return $false }
              $stream.Position = 0x3C
              $header = [long]$reader.ReadUInt32()
              if ($header + 4 -gt $stream.Length) { return $false }
              $stream.Position = $header
              return $reader.ReadUInt32() -eq 0x00004550
            } finally {
              $stream.Dispose()
            }
          }

          $unpacked = (Resolve-Path unpacked).Path
          $problems = @()
          $listed = @()
          foreach ($tree in $trees.Keys) {
            $signedHashes = @($signedFor[$trees[$tree]] | ForEach-Object { (Get-FileHash -LiteralPath $_.FullName).Hash })
            $scanned = 0
            $files = if (Test-Path -LiteralPath "unpacked/$tree") { Get-ChildItem -Recurse -File "unpacked/$tree" } else { @() }
            foreach ($file in $files) {
              if (-not (Test-PortableExecutable $file.FullName)) { continue }
              $scanned++
              $relative = [System.IO.Path]::GetRelativePath($unpacked, $file.FullName).Replace('\', '/')
              if ((Get-FileHash -LiteralPath $file.FullName).Hash -in $signedHashes) {
                "signed by SignPath: $relative"
              } elseif ($thirdParty.Contains($relative)) {
                $listed += $relative
                $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
                $signer = if ($signature.SignerCertificate) { $signature.SignerCertificate.GetNameInfo('SimpleName', $false) } else { 'nobody' }
                "third-party: $relative ($($thirdParty[$relative])); Authenticode $($signature.Status), signed by $signer"
              } else {
                $problems += "$relative was not signed by SignPath and is not on the third-party list"
              }
            }
            "unpacked/${tree}: $scanned PE files"
            if ($scanned -eq 0) {
              $problems += "unpacked/$tree holds no PE file, so its unpacking failed and nothing in it was checked"
            }
          }
          foreach ($entry in $thirdParty.Keys | Where-Object { $_ -notin $listed }) {
            $problems += "$entry is on the third-party list but in neither installer; remove it from the list in release-please.yml"
          }
          if ($problems) {
            throw "the installers failed the check:`n$($problems -join "`n")"
          }
        STALE_ANCHOR: |2
            'msi-streams/Binary.WixUIWixca' = $wixAction
        STALE_ENTRY: |2
            'nsis/$PLUGINSDIR/Gone.dll' = $nsisPlugin
      run: |
        $script = Join-Path $env:RUNNER_TEMP 'check.ps1'
        Set-Content -LiteralPath $script -Value $env:CHECK_SCRIPT
        $staleScript = Join-Path $env:RUNNER_TEMP 'check-stale.ps1'
        Set-Content -LiteralPath $staleScript -Value $env:CHECK_SCRIPT.Replace($env:STALE_ANCHOR, $env:STALE_ANCHOR + $env:STALE_ENTRY)
        if ((Get-Content -Raw $staleScript) -notmatch 'Gone\.dll') { throw 'the stale-entry mutation did not apply' }
        function Invoke-Check([string] $dir, [string] $signer, [string] $file = $script) {
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item -Recurse installers-to-sign, installers-signed, app-signed -Destination $dir
          if ($dir -eq 'neg-unsent') { Remove-Item -LiteralPath "$dir/app-signed/platevault-library.exe" }
          $env:AUTHENTICODE_SIGNER = $signer
          Push-Location $dir
          $message = ''
          try { & $file | Out-Host } catch { $message = $_.Exception.Message } finally { Pop-Location }
          Write-Host "== $dir threw: $message"
          return $message
        }
        function Assert-Threw([string] $message, [string] $pattern, [string] $case) {
          if ($message -notmatch $pattern) { throw "the check did not fail as expected for $case" }
          "ok: $case"
        }
        $m = Invoke-Check neg-signer 'SignPath Foundation'
        Assert-Threw $m 'must carry a valid signature by SignPath Foundation' 'a signature not made by SignPath Foundation'
        $m = Invoke-Check neg-unsent 'PlateVault signing rehearsal'
        Assert-Threw $m '(?s)platevault-library\.exe was not signed by SignPath and is not on the third-party list' 'an executable SignPath did not sign'
        $m = Invoke-Check neg-stale 'PlateVault signing rehearsal' $staleScript
        Assert-Threw $m '(?s)nsis/\$PLUGINSDIR/Gone\.dll is on the third-party list but in neither installer' 'a stale third-party entry'
        # 7-Zip that exits 0 but unpacks nothing from the MSI's streams.
        $real7z = (Get-Command 7z -CommandType Application | Select-Object -First 1).Source
        function Invoke-QuietlyEmpty7z { if ($args -contains '-tCompound') { $global:LASTEXITCODE = 0; return }; & $real7z @args }
        Set-Alias -Name 7z -Value Invoke-QuietlyEmpty7z -Scope Global
        $m = Invoke-Check neg-empty 'PlateVault signing rehearsal'
        Remove-Item Alias:7z
        Assert-Threw $m '(?s)unpacked/msi-streams holds no PE file' 'an MSI-streams scan that unpacked nothing'
        Assert-Threw $m '(?s)msi-streams/Binary\.WixUIWixca is on the third-party list but in neither installer' 'the WixUIWixca entry left unmatched'
        'every negative case failed as it should'
    - name: Sign the signed installers for the updater
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $version = (Get-Content -Raw apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
        if (-not $version) { throw 'apps/desktop/src-tauri/tauri.conf.json has no version' }
        foreach ($installer in Get-ChildItem -File installers-signed | Where-Object Extension -In '.exe', '.msi') {
          pnpm --dir apps/desktop exec tauri signer sign --app-version $version $installer.FullName
        }
